name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Must equal the minimum in requires-python (ADR 0007): CI validates
          # the oldest supported version, where incompatibilities show up first.
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -e ".[yfinance,calendar,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest