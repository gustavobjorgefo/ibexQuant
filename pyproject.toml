[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibexQuant"
version = "0.1.0"
description = "Personal quant research and backtesting framework."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/ibexQuant"]