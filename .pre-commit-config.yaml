# All hooks run the tools installed in the project environment (language: system),
# so versions and configuration always match what runs in the terminal.
# Commits must be made with the virtual environment activated.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        # Check the whole project as configured in pyproject.toml, not only staged files.
        pass_filenames: false
        # Trigger on source changes and on configuration changes.
        files: ^(src/|pyproject\.toml$)